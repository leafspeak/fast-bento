# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Compatible with Minecraft 26.1, 26.2, and 26.3 (including betas and release candidates)
minecraft_version=26.3
# ⚠️ YARN MAPPINGS: Not yet published for 26.x
# Current latest: 1.21.11+build.6
# Once 26.3 yarn is released, change to: yarn_mappings=26.3+build.1
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.13-SNAPSHOT

# Mod Properties
mod_version=3.0.0+26.x
maven_group=re.domi
archives_base_name=fast-bento

# Dependencies
# Fabric API: 0.162.0+26.3 is the latest for 26.3
fabric_version=0.162.0+26.3
mod_menu_version=20.0.0
